services:
  - type: web
    name: ebook-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install --include=dev && npm run prisma:generate && npm run build
    startCommand: npm run prisma:push && npm run start:prod
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_WEBHOOK_SECRET
        value: rzp_secret_key_2026
      - key: PORT
        value: 10000
