services:
  - type: web
    name: ebook-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ebook-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_WEBHOOK_SECRET
        value: rzp_secret_key_2026
      - key: PORT
        value: 10000

databases:
  - name: ebook-db
    databaseName: ebook_db
    user: ebook_user
    plan: free
