services:
  - type: web
    name: ebook-backend
    env: docker
    dockerfilePath: Dockerfile
    rootDir: backend
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_WEBHOOK_SECRET
        value: rzp_secret_key_2026
      - key: PORT
        value: 10000
